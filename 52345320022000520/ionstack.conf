ashmem_open_off               = 0x01434ff8
ashmem_release_off            = 0x01435000
ashmem_show_fdinfo_off        = 0x014255e8
ashmem_read_iter_off          = 0x01425370
configfs_read_file_off        = 0x01434088
configfs_write_bin_file_off   = 0x01434458
copy_splice_read_off          = 0x01425558
noop_llseek_off               = 0x01422758

# kernel variables
init_task_off                 = 0x027ec200
init_uts_ns_off               = 0x02839968
empty_zero_page_off           = 0x028ec000
root_task_group_off           = 0x028f0700
