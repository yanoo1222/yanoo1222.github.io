<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ionstack config archive</title>
</head>
<body>

<h1>Quest 3 ionstack conf Archive</h1>

<table border="1" cellpadding="5" style="border-collapse: collapse; width: 100%;">
    <thead>
        <tr>
            <th>Incremental</th>
            <th>Version</th>
            <th>Download</th>
        </tr>
    </thead>
    <tbody id="firmwareBody">
    </tbody>
</table>

<p id="entryCount">15 entries will add more later</p>

<script>
    (function() {
        // enetries
        const entries = [
            { incremental: "52345320027600520", version: "206.0.0.101.1332.1018412879" },
            { incremental: "52345320026300520", version: "206.0.0.95.1332.1016953866" },
            { incremental: "52345320022000520", version: "206.0.0.79.1332.1012196207" },
            { incremental: "52270740038100520", version: "205.0.0.112.1674.1009731786" },
            { incremental: "52270740036900520", version: "205.0.0.112.1674.1008784489" },
            { incremental: "52270740034800520", version: "205.0.0.112.1674.1005370997" },
            { incremental: "52270740031100520", version: "205.0.0.112.1674.1001582574" },
            { incremental: "52270740028400520", version: "205.0.0.112.1674.997916363" },
            { incremental: "52270740024300520", version: "205.0.0.112.1674.993488020" },
            { incremental: "52270740021500520", version: "205.0.0.78.1674.991190647" },
            { incremental: "52270740013000520", version: "205.0.0.3.1674.982626811" },
            { incremental: "52168470052900520", version: "204.0.0.200.1183.996826085" },
            { incremental: "52168470043600520", version: "204.0.0.160.1183.985169528" },
            { incremental: "52168470047000520", version: "204.0.0.148.1183.980959173" },
            { incremental: "52168470039400520", version: "204.0.0.144.1183.979667119" }
        ];

        // the funsion to download your increamtal
        function downloadConfig(incremental) {
            const item = entries.find(e => e.incremental === incremental);
            if (!item) return false;

            const confContent = 
                '# ionstack.conf\n' +
                '# incremental: ' + item.incremental + '\n' +
                '# version: ' + item.version + '\n' +
                '\n' +
                'server {\n' +
                '    # firmware ' + item.incremental + '\n' +
                '    version ' + item.version + ';\n' +
                '}\n';

            const blob = new Blob([confContent], { type: 'text/plain' });
            const url = URL.createObjectURL(blob);

            const a = document.createElement('a');
            a.href = url;
            a.download = 'ionstack.conf';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);

            setTimeout(() => URL.revokeObjectURL(url), 250);
            return true;
        }

        const path = window.location.pathname;
        const match = path.match(/\/(\d+)\/ionstack\.conf$/);
        if (match) {
            const incremental = match[1];
            if (downloadConfig(incremental)) {
                document.body.innerHTML = `<h2>Downloading ionstack.conf for ${incremental}...</h2><p><a href="/">Return to archive</a></p>`;
                return;
            }
        }

        const tbody = document.getElementById('firmwareBody');
        if (!tbody) return;

        const fragment = document.createDocumentFragment();

        entries.forEach(item => {
            const tr = document.createElement('tr');

            const tdInc = document.createElement('td');
            tdInc.textContent = item.incremental;

            const tdVer = document.createElement('td');
            tdVer.textContent = item.version;

            const tdAction = document.createElement('td');
            const link = document.createElement('a');
            link.href = `/${item.incremental}/ionstack.conf`;
            link.textContent = 'download';
            tdAction.appendChild(link);

            tr.appendChild(tdInc);
            tr.appendChild(tdVer);
            tr.appendChild(tdAction);
            fragment.appendChild(tr);
        });

        tbody.appendChild(fragment);

        document.getElementById('entryCount').textContent = entries.length + ' entries';
    })();
</script>

</body>
</html>
